<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DevOps workflow illustration">
  <defs>
    <linearGradient id="flowGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="#f5f1ed" />
  <!-- Title area -->
  <rect width="400" height="60" fill="url(#flowGrad)" rx="16" />
  <text x="200" y="40" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">DevOps Pipeline</text>
  
  <!-- Stage 1: Code -->
  <circle cx="50" cy="150" r="30" fill="#4f46e5" />
  <text x="50" y="155" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">CODE</text>
  
  <!-- Arrow -->
  <path d="M85 150h40" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
  
  <!-- Stage 2: Build -->
  <circle cx="150" cy="150" r="30" fill="#ec4899" />
  <text x="150" y="155" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">BUILD</text>
  
  <!-- Arrow -->
  <path d="M185 150h40" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
  
  <!-- Stage 3: Deploy -->
  <circle cx="250" cy="150" r="30" fill="#8b5cf6" />
  <text x="250" y="155" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">DEPLOY</text>
  
  <!-- Arrow -->
  <path d="M285 150h40" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
  
  <!-- Stage 4: Monitor -->
  <circle cx="350" cy="150" r="30" fill="#06b6d4" />
  <text x="350" y="155" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">MONITOR</text>
  
  <!-- Feedback loop -->
  <path d="M350 185c0 30 -150 35 -300 0" stroke="#3b82f6" stroke-width="3" fill="none" stroke-dasharray="5,5" stroke-linecap="round" />
  <text x="200" y="235" text-anchor="middle" fill="#64748b" font-size="14">Continuous Feedback Loop</text>
</svg>
