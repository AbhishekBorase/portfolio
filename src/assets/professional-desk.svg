<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Professional desk workspace">
  <defs>
    <linearGradient id="woodDesk" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8b6f47" />
      <stop offset="100%" stop-color="#6b5435" />
    </linearGradient>
  </defs>
  <rect width="400" height="600" rx="20" fill="#f5f1ed" />
  <!-- Desk -->
  <rect x="20" y="300" width="360" height="280" fill="url(#woodDesk)" rx="8" />
  <!-- Monitor -->
  <rect x="60" y="80" width="280" height="200" fill="#2c3e50" rx="12" />
  <rect x="70" y="90" width="260" height="180" fill="#1a2332" rx="8" />
  <!-- Monitor stand -->
  <rect x="180" y="270" width="40" height="35" fill="#6b5435" />
  <!-- Keyboard -->
  <rect x="80" y="330" width="240" height="40" fill="#34495e" rx="4" />
  <!-- Mouse -->
  <ellipse cx="340" cy="350" rx="20" ry="25" fill="#34495e" />
  <!-- Notebook -->
  <rect x="30" y="380" width="80" height="120" fill="#e3d5c8" rx="4" />
  <path d="M35 400h70M35 420h70M35 440h70M35 460h70" stroke="#999" stroke-width="1" stroke-linecap="round" />
  <!-- Coffee cup -->
  <ellipse cx="280" cy="395" rx="18" ry="12" fill="#8b6f47" />
  <path d="M300 385c0 0 15 5 15 15c0 10 -8 15 -15 15" fill="none" stroke="#8b6f47" stroke-width="4" stroke-linecap="round" />
  <!-- Plant -->
  <ellipse cx="100" cy="200" rx="35" ry="50" fill="#27ae60" />
  <line x1="100" y1="250" x2="100" y2="300" stroke="#8b6f47" stroke-width="8" />
</svg>
