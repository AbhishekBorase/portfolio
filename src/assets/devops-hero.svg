<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f1ed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8dfd6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beigeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6f47;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="url(#bgGradient)"/>

  <!-- Cloud infrastructure (top) -->
  <g id="cloud-section">
    <!-- Cloud shapes -->
    <ellipse cx="80" cy="60" rx="35" ry="25" fill="#3b82f6" opacity="0.3"/>
    <ellipse cx="110" cy="50" rx="40" ry="30" fill="#3b82f6" opacity="0.2"/>
    <ellipse cx="420" cy="70" rx="38" ry="28" fill="#38bdf8" opacity="0.25"/>
    <ellipse cx="450" cy="55" rx="35" ry="25" fill="#38bdf8" opacity="0.2"/>

    <!-- Cloud icon lines -->
    <circle cx="250" cy="70" r="3" fill="#3b82f6"/>
    <line x1="250" y1="70" x2="250" y2="120" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Server/Container boxes (middle section) -->
  <g id="servers">
    <!-- Left server -->
    <rect x="40" y="150" width="80" height="90" rx="6" fill="white" stroke="#d4a574" stroke-width="2"/>
    <rect x="50" y="160" width="60" height="12" rx="2" fill="#3b82f6" opacity="0.8"/>
    <circle cx="58" cy="182" r="3" fill="#3b82f6"/>
    <circle cx="68" cy="182" r="3" fill="#3b82f6"/>
    <circle cx="78" cy="182" r="3" fill="#3b82f6"/>
    <circle cx="58" cy="200" r="3" fill="#38bdf8"/>
    <circle cx="68" cy="200" r="3" fill="#38bdf8"/>
    <circle cx="78" cy="200" r="3" fill="#38bdf8"/>
    <text x="80" y="230" font-size="10" text-anchor="middle" fill="#8b6f47" font-weight="600">SERVER</text>

    <!-- Center server (taller) -->
    <rect x="190" y="130" width="80" height="140" rx="6" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <rect x="200" y="140" width="60" height="14" rx="2" fill="url(#blueGrad)"/>
    <circle cx="208" cy="165" r="3" fill="#38bdf8"/>
    <circle cx="220" cy="165" r="3" fill="#38bdf8"/>
    <circle cx="232" cy="165" r="3" fill="#38bdf8"/>
    <circle cx="244" cy="165" r="3" fill="#38bdf8"/>
    <circle cx="208" cy="185" r="3" fill="#3b82f6"/>
    <circle cx="220" cy="185" r="3" fill="#3b82f6"/>
    <circle cx="232" cy="185" r="3" fill="#3b82f6"/>
    <circle cx="244" cy="185" r="3" fill="#3b82f6"/>
    <circle cx="208" cy="205" r="3" fill="#38bdf8"/>
    <circle cx="220" cy="205" r="3" fill="#38bdf8"/>
    <circle cx="232" cy="205" r="3" fill="#38bdf8"/>
    <circle cx="244" cy="205" r="3" fill="#38bdf8"/>
    <text x="230" y="260" font-size="10" text-anchor="middle" fill="#8b6f47" font-weight="600">DOCKER</text>

    <!-- Right server -->
    <rect x="380" y="150" width="80" height="90" rx="6" fill="white" stroke="#38bdf8" stroke-width="2"/>
    <rect x="390" y="160" width="60" height="12" rx="2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="398" cy="182" r="3" fill="#3b82f6"/>
    <circle cx="408" cy="182" r="3" fill="#3b82f6"/>
    <circle cx="418" cy="182" r="3" fill="#3b82f6"/>
    <circle cx="398" cy="200" r="3" fill="#38bdf8"/>
    <circle cx="408" cy="200" r="3" fill="#38bdf8"/>
    <circle cx="418" cy="200" r="3" fill="#38bdf8"/>
    <text x="420" y="230" font-size="10" text-anchor="middle" fill="#8b6f47" font-weight="600">K8S POD</text>
  </g>

  <!-- Connection lines -->
  <g id="connections">
    <line x1="120" y1="195" x2="190" y2="195" stroke="#d4a574" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="270" y1="270" x2="420" y2="195" stroke="#d4a574" stroke-width="2" stroke-dasharray="3,3"/>
  </g>

  <!-- Pipeline arrows -->
  <g id="pipeline">
    <!-- Arrow 1 -->
    <path d="M 140 280 L 160 280" stroke="#3b82f6" stroke-width="2" fill="none"/>
    <polygon points="160,280 155,275 157,280 155,285" fill="#3b82f6"/>

    <!-- Arrow 2 -->
    <path d="M 290 280 L 310 280" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <polygon points="310,280 305,275 307,280 305,285" fill="#38bdf8"/>

    <!-- Arrow 3 -->
    <path d="M 360 280 L 380 280" stroke="#d4a574" stroke-width="2" fill="none"/>
    <polygon points="380,280 375,275 377,280 375,285" fill="#d4a574"/>
  </g>

  <!-- Pipeline stages -->
  <g id="stages">
    <circle cx="170" cy="280" r="18" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <text x="170" y="284" font-size="12" text-anchor="middle" fill="#3b82f6" font-weight="700">CI</text>

    <circle cx="300" cy="280" r="18" fill="white" stroke="#38bdf8" stroke-width="2"/>
    <text x="300" y="284" font-size="12" text-anchor="middle" fill="#38bdf8" font-weight="700">CD</text>

    <circle cx="410" cy="280" r="18" fill="white" stroke="#d4a574" stroke-width="2"/>
    <text x="410" y="284" font-size="12" text-anchor="middle" fill="#d4a574" font-weight="700">◉</text>
  </g>

  <!-- Monitor/Dashboard (bottom) -->
  <g id="monitor">
    <rect x="160" y="320" width="180" height="60" rx="4" fill="white" stroke="#8b6f47" stroke-width="2"/>
    <!-- Screen lines -->
    <line x1="175" y1="335" x2="325" y2="335" stroke="#3b82f6" stroke-width="2"/>
    <line x1="175" y1="348" x2="315" y2="348" stroke="#38bdf8" stroke-width="2"/>
    <line x1="175" y1="361" x2="320" y2="361" stroke="#d4a574" stroke-width="2"/>
    <!-- Base -->
    <rect x="235" y="380" width="30" height="8" fill="#8b6f47" rx="2"/>
  </g>

  <!-- Decorative accent dots -->
  <g id="accents" opacity="0.6">
    <circle cx="100" cy="320" r="2" fill="#3b82f6"/>
    <circle cx="400" cy="310" r="2" fill="#38bdf8"/>
    <circle cx="50" cy="350" r="2" fill="#d4a574"/>
  </g>
</svg>
