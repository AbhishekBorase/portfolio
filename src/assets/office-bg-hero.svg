<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Professional office background">
  <defs>
    <linearGradient id="officeBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#e8dfd6" />
      <stop offset="50%" stop-color="#f5f1ed" />
      <stop offset="100%" stop-color="#ddd5cc" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#c4b5a0" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#officeBg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <!-- Window light gradient overlay -->
  <rect width="1920" height="1080" fill="url(#officeBg)" opacity="0.3"/>
  <!-- Subtle desk area -->
  <ellipse cx="960" cy="800" rx="800" ry="400" fill="#d4a574" opacity="0.08"/>
</svg>
