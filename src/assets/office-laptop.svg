<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Laptop illustration">
  <defs>
    <linearGradient id="screenGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="200" height="160" rx="20" fill="#f5f1ed" />
  <!-- Laptop base/keyboard -->
  <rect x="25" y="85" width="150" height="12" rx="2" fill="#6b5435" />
  <!-- Laptop screen -->
  <rect x="20" y="25" width="160" height="70" rx="4" fill="#8b7355" />
  <rect x="25" y="30" width="150" height="60" rx="2" fill="url(#screenGrad)" />
  <!-- Screen content - code lines -->
  <line x1="35" y1="42" x2="120" y2="42" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
  <line x1="35" y1="52" x2="155" y2="52" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <line x1="35" y1="62" x2="140" y2="62" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <!-- Stand -->
  <path d="M70 80L60 85M130 80L140 85" stroke="#6b5435" stroke-width="4" stroke-linecap="round" />
</svg>
