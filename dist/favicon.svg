<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f9cfc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60d1c6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#070b14"/>
  
  <!-- Main gear/cog for DevOps -->
  <g transform="translate(50, 50)">
    <!-- Outer gear -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#grad1)" stroke-width="3"/>
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#grad1)" stroke-width="2"/>
    
    <!-- Cog teeth -->
    <g stroke="url(#grad1)" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-28" x2="0" y2="-35"/>
      <line x1="19.8" y1="-19.8" x2="24.7" y2="-24.7"/>
      <line x1="28" y1="0" x2="35" y2="0"/>
      <line x1="19.8" y1="19.8" x2="24.7" y2="24.7"/>
      <line x1="0" y1="28" x2="0" y2="35"/>
      <line x1="-19.8" y1="19.8" x2="-24.7" y2="24.7"/>
      <line x1="-28" y1="0" x2="-35" y2="0"/>
      <line x1="-19.8" y1="-19.8" x2="-24.7" y2="-24.7"/>
    </g>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="4" fill="url(#grad1)"/>
  </g>
</svg>
